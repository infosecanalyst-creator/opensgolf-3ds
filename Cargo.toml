[workspace]
resolver = "2"
members = ["crates/sg-core", "crates/simgolf", "crates/sgtool", "crates/sgplay", "crates/simgolf-3ds"]
exclude = ["vendor"]

[workspace.package]
version = "0.8.4"
edition = "2021"
license = "GPL-2.0-or-later"

[profile.release]
opt-level = 3

# The New 3DS build: `cargo 3ds build --profile release-3ds -p simgolf-3ds` (SG-01). Cargo only reads profiles from
# this workspace root, so the [profile.release] in crates/simgolf-3ds/Cargo.toml was ignored. Whole-program LTO and one
# codegen unit make the ARM11 code smaller and faster. panic stays "unwind": the game catches worker-thread panics
# (game-file import, HD make) and reports them, and the 3DS panic hook shows the error applet and then unwinds to a
# clean exit; with "abort" both would become crashes (and cargo-3ds's build-std list has no panic_abort).
[profile.release-3ds]
inherits = "release"
lto = "fat"
codegen-units = 1

# The course report simulates hundreds of rounds; keep debug builds usable.
[profile.dev]
opt-level = 1

# miniquad 0.4.11 with one fix for 64-bit ARM Windows (vendor/miniquad/README-OPENSGOLF.md); the rest is upstream's code
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }

# The 3DS crates (crates/simgolf-3ds), vendored with two one-line fixes to their build scripts for Windows paths
# (vendor/ctru-rs/ctru-sys/build.rs, vendor/citro3d-rs/citro3d-sys/build.rs: "OpenSGolf (Windows)")
[patch."https://github.com/rust3ds/ctru-rs.git"]
ctru-rs = { path = "vendor/ctru-rs/ctru-rs" }
ctru-sys = { path = "vendor/ctru-rs/ctru-sys" }
[patch."https://github.com/rust3ds/citro3d-rs.git"]
citro3d = { path = "vendor/citro3d-rs/citro3d" }
citro3d-sys = { path = "vendor/citro3d-rs/citro3d-sys" }
