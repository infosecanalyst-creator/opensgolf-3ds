name: release

# Pushing a tag such as v0.1.0, or running this workflow by hand with a version (Actions > release > Run workflow), builds
# OpenSGolf for every platform and publishes a GitHub release with the packages. The file names carry no version, so the
# README's links to releases/latest/download/<name> always give the newest release:
#   Linux    opensgolf-linux-x86_64.tar.gz and opensgolf-linux-x86_64.AppImage
#   ARM64    opensgolf-linux-arm64.tar.gz and opensgolf-linux-arm64.AppImage (64-bit ARM Linux, Raspberry Pi 4/5)
#   macOS    opensgolf-macos.zip (OpenSGolf.app, Apple silicon and Intel)
#   Windows  opensgolf-windows.zip (x64) and opensgolf-windows-arm64.zip (Windows on ARM, e.g. Snapdragon laptops)
#   Android  opensgolf-android.apk (signed with a debug key, for sideloading)
#   browser  opensgolf-web.zip
# Each Windows .zip and Linux .tar.gz also comes as NAME-bin.zip / NAME-bin.tar.gz, the same package without packs/ (the
# programs, lang and the documents, a few MB), with opensgolf-packs.sha256 listing every file in packs/: the game's
# "Update now" then downloads only the programs and the pack files that changed (GitHub issue #65, autoupdate.rs),
# and SHA256SUMS with SHA256SUMS.sig, its ed25519 signature, which the game's "Update now" checks before installing a
# package (crates/simgolf/src/autoupdate.rs; the key is the secret OPENSGOLF_UPDATE_KEY, docs/RELEASING.md).
# The icon is the engine's own drawing (sg_core::freeset::app_icon, `sgtool icon`).

# OpenSGolf 3DS fork: upstream's desktop, Android and Pages builds run only when started by hand (the 3DS build is 3ds.yml)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v0.1.1 (empty: build the packages only, no release)"
        required: false

permissions:
  contents: write

env:
  BIN: opensgolf
  # the version: the pushed tag, or the version typed when running the workflow by hand
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'dev' }}

jobs:
  linux:
    # x86_64 PCs, and 64-bit ARM (Raspberry Pi 4/5, ARM laptops) on GitHub's ARM runners. Built on the oldest Ubuntu LTS
    # in standard support, because a program needs a glibc at least as new as the one it was built against: built here,
    # the AppImage and tar.gz run on that release and anything newer.
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, name: x86_64, appimage: x86_64 }
          - { os: ubuntu-22.04-arm, name: arm64, appimage: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Build
        run: cargo build --release -p opensgolf -p sgtool
      - name: glibc check
        # fails the release if the game needs a newer glibc than Ubuntu 22.04's (2.35)
        run: |
          need=$(objdump -T target/release/opensgolf | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "opensgolf needs $need"
          [ "$(printf '%s\n%s\n' "$need" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ]
      - name: Icons
        run: target/release/sgtool icon icons 256
      - name: tar.gz
        run: |
          out="opensgolf-linux-${{ matrix.name }}"
          mkdir -p "$out"
          cp target/release/opensgolf target/release/sgtool "$out/"
          cp LICENSE README.md docs/PLAYING.md docs/MODDING.md packaging/linux/opensgolf.desktop "$out/"
          cp icons/icon_256.png "$out/opensgolf.png"
          cp -r packs lang "$out/"
          tar czf "$out.tar.gz" "$out"
          # the same without packs/, for selective updates (autoupdate.rs)
          tar czf "$out-bin.tar.gz" --exclude="$out/packs" "$out"
      - name: AppImage
        run: |
          # the game finds its packs and translations next to the program (usr/bin), its saves in ~/.local/share/opensgolf
          app=AppDir
          mkdir -p "$app/usr/bin" "$app/usr/share/applications" "$app/usr/share/icons/hicolor/256x256/apps"
          cp target/release/opensgolf target/release/sgtool "$app/usr/bin/"
          cp -r packs lang "$app/usr/bin/"
          cp packaging/linux/opensgolf.desktop "$app/" && cp packaging/linux/opensgolf.desktop "$app/usr/share/applications/"
          cp icons/icon_256.png "$app/opensgolf.png"
          cp icons/icon_256.png "$app/usr/share/icons/hicolor/256x256/apps/opensgolf.png"
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/opensgolf" "$@"\n' > "$app/AppRun"
          chmod +x "$app/AppRun"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage }}.AppImage
          chmod +x appimagetool
          ARCH=${{ matrix.appimage }} APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$app" "opensgolf-linux-${{ matrix.name }}.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}
          path: |
            opensgolf-*.tar.gz
            opensgolf-*.AppImage

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$t" -p opensgolf -p sgtool
          done
      - name: OpenSGolf.app
        run: |
          app=OpenSGolf.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          # one universal program for Apple silicon and Intel Macs
          for b in opensgolf sgtool; do
            lipo -create -output "$app/Contents/MacOS/$b" "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
          done
          # the game finds its packs and translations next to the program, its saves in ~/Library/Application Support/OpenSGolf
          cp -r packs lang "$app/Contents/MacOS/"
          sed "s/@VERSION@/${VERSION#v}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # the icon: every size iconutil wants, drawn by sgtool
          target/aarch64-apple-darwin/release/sgtool icon icons 16 32 64 128 256 512 1024
          set=opensgolf.iconset && mkdir -p "$set"
          for n in 16 32 128 256 512; do
            cp "icons/icon_$n.png" "$set/icon_${n}x${n}.png"
            cp "icons/icon_$((n * 2)).png" "$set/icon_${n}x${n}@2x.png"
          done
          iconutil -c icns "$set" -o "$app/Contents/Resources/opensgolf.icns"
          # not notarised: an ad-hoc signature lets it run once the player allows it (README, Install)
          codesign --force --deep --sign - "$app"
          out="opensgolf-macos"
          mkdir -p "$out"
          mv "$app" "$out/"
          cp LICENSE README.md docs/PLAYING.md docs/MODDING.md "$out/"
          ditto -c -k --keepParent "$out" "$out.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: opensgolf-macos.zip

  windows:
    strategy:
      matrix:
        include:
          # the x64 package keeps its old name so existing download links keep working
          - { os: windows-latest, name: x86_64, out: opensgolf-windows }
          - { os: windows-11-arm, name: arm64, out: opensgolf-windows-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p opensgolf -p sgtool
      - name: Package
        shell: bash
        run: |
          out="${{ matrix.out }}"
          mkdir -p "$out"
          cp target/release/opensgolf.exe target/release/sgtool.exe "$out/"
          target/release/sgtool.exe icon icons 256
          cp icons/icon_256.png "$out/opensgolf.png"
          cp LICENSE README.md docs/PLAYING.md docs/MODDING.md "$out/"
          cp -r packs lang "$out/"
          7z a "$out.zip" "$out" > /dev/null
          # the same without packs/, for selective updates (autoupdate.rs)
          7z a "$out-bin.zip" "$out" '-xr!packs' > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}
          path: |
            ${{ matrix.out }}.zip
            ${{ matrix.out }}-bin.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the APK (notfl3/cargo-apk image)
        env:
          # optional: a base64 debug.keystore (store and key password "android", alias "androiddebugkey") so that every
          # release is signed with the same key and installs over the last one; without it each build makes a new key
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          mkdir -p android-home
          if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > android-home/debug.keystore; fi
          docker run --rm -v "$PWD":/root/src -v "$PWD/android-home":/root/.android -w /root/src notfl3/cargo-apk \
            tools/android_build.sh release /root/src/apk
          sudo cp apk/opensgolf-release.apk "opensgolf-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: opensgolf-android.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the browser version
        run: ./web/build.sh
      - name: Package
        run: |
          cp LICENSE web/dist/
          (cd web/dist && zip -qr "../../opensgolf-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: opensgolf-web.zip

  publish:
    needs: [linux, macos, windows, android, web]
    runs-on: ubuntu-latest
    # this fork publishes no builds (lang/en.txt holds the original game's text); see README
    if: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List the packs' files (opensgolf-packs.sha256)
        # a selective update compares these with the player's copy and fetches only the files that differ, from this
        # release's tag in the repository (autoupdate.rs); signed with the packages below
        run: (cd src && find packs -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > dist/opensgolf-packs.sha256
      - name: Sign the packages (SHA256SUMS, SHA256SUMS.sig)
        # "Update now" (crates/simgolf/src/autoupdate.rs) installs only a package whose SHA-256 is in SHA256SUMS, signed
        # with the key in the OPENSGOLF_UPDATE_KEY secret (the private key `sgtool update-keygen` prints: 64 hex digits,
        # docs/RELEASING.md). Without the secret the release is still published, unsigned, with a warning; the game then
        # refuses Update now for it and offers the download page.
        env:
          OPENSGOLF_UPDATE_KEY: ${{ secrets.OPENSGOLF_UPDATE_KEY }}
        run: |
          cd dist
          sha256sum opensgolf-* > SHA256SUMS
          cat SHA256SUMS
          if [ -z "$OPENSGOLF_UPDATE_KEY" ]; then
            echo "::warning::The OPENSGOLF_UPDATE_KEY secret is not set: SHA256SUMS is not signed, so the game's Update now refuses this release (docs/RELEASING.md)"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/update.der"
          # the 32-byte ed25519 seed as a PKCS#8 key for openssl (the fixed DER header of an Ed25519 private key)
          python3 -c 'import os, sys; k = os.environ["OPENSGOLF_UPDATE_KEY"].strip(); assert len(k) == 64, "OPENSGOLF_UPDATE_KEY must be 64 hex digits"; sys.stdout.buffer.write(bytes.fromhex("302e020100300506032b657004220420" + k))' > "$key"
          openssl pkeyutl -sign -inkey "$key" -keyform DER -rawin -in SHA256SUMS -out SHA256SUMS.sig
          # the public key, to compare with autoupdate.rs's PUBLIC_KEY_HEX
          echo "signed with public key $(openssl pkey -inform DER -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          rm -f "$key"
          test "$(stat -c %s SHA256SUMS.sig)" = 64
      - name: Release notes (this version's section of CHANGELOG.md)
        # "## 0.6 (...)" up to the next "## ": the highlights of the minor version (a 0.6.x fix release shows them too),
        # above GitHub's list of the changes since the last release
        run: |
          python3 - "$VERSION" <<'PY'
          import re, sys
          v = sys.argv[1].lstrip("v")
          minor = ".".join(v.split(".")[:2])
          text = open("src/CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(minor) + r" \(.*?(?=^## |\Z)", text, re.S | re.M)
          body = m.group(0).strip() if m else ""
          body = body.replace("](docs/", "](https://github.com/crspytopgn/opensgolf/blob/main/docs/")
          body += "\n\nEverything, version by version: [CHANGELOG.md](https://github.com/crspytopgn/opensgolf/blob/main/CHANGELOG.md)\n"
          open("release-notes.md", "w", encoding="utf-8").write(body)
          print(body)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          # a run by hand creates the tag on the commit it built
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: OpenSGolf ${{ env.VERSION }}
          files: dist/*
          make_latest: true
          generate_release_notes: true

  stores:
    # After the release: the Homebrew cask (crspytopgn/homebrew-tap) and winget's manifest (microsoft/winget-pkgs) move to
    # the new version. Each needs a token secret (docs/RELEASING.md, "Store updates"); without it the step says so and
    # does nothing, and a store that fails never fails the release, which is already published.
    needs: publish
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Homebrew cask
        shell: bash
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::HOMEBREW_TAP_TOKEN is not set: update the Homebrew cask by hand (docs/RELEASING.md)"; exit 0; fi
          v="${VERSION#v}"
          url="https://github.com/crspytopgn/opensgolf/releases/download/$VERSION"
          sum=$(curl -fsSL "$url/SHA256SUMS" | awk '$2 == "opensgolf-macos.zip" { print $1 }')
          test ${#sum} = 64
          git clone -q "https://x-access-token:$TOKEN@github.com/crspytopgn/homebrew-tap.git" tap
          cd tap
          sed -i -E "s/^  version \"[^\"]+\"/  version \"$v\"/; s/^  sha256 \"[0-9a-f]+\"/  sha256 \"$sum\"/" Casks/opensgolf.rb
          git diff --stat
          if git diff --quiet; then echo "the cask is already at $v"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qam "opensgolf $v"
          git push -q origin HEAD
      - name: winget
        shell: pwsh
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:TOKEN) { Write-Output "::warning::WINGET_TOKEN is not set: update winget's manifest by hand (docs/RELEASING.md)"; exit 0 }
          $v = $env:VERSION.TrimStart("v")
          $url = "https://github.com/crspytopgn/opensgolf/releases/download/$env:VERSION"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          # a pull request to microsoft/winget-pkgs from the token's account, its installers and hashes from the release
          .\wingetcreate.exe update crspytopgn.OpenSGolf --version $v --urls "$url/opensgolf-windows.zip|x64" "$url/opensgolf-windows-arm64.zip|arm64" --submit --token $env:TOKEN
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::wingetcreate could not update crspytopgn.OpenSGolf (is the package in winget yet?)"; exit 0 }
